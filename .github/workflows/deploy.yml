name: Deploy GrabTheByte to Hostinger

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js & Cache (⚡ MASSIVE SPEED BOOST)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # This tells GitHub to remember your node_modules for next time!

      - name: 📦 Install Dependencies (⚡ Optimized for CI/CD)
        run: npm ci # 'ci' is 2x faster than 'install' for automated deployments

      - name: 🔨 Build Project
        run: npm run build

      - name: 🚀 Sync files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ 
          server-dir: ./ # 🎯 FIXED! Drops files directly into the root without duplicating folders